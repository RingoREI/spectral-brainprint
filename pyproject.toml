[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-brainprint"
version = "0.1.0.dev0"
description = "Reproducible spectral and spatial EEG identity research"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2", "scikit-learn>=1.7,<2"]

[project.optional-dependencies]
plots = ["matplotlib>=3.10,<4"]
eeg = ["h5py>=3.10,<4"]
deep = ["torch>=2.7.1,<3", "h5py>=3.10,<4"]

[project.scripts]
spectral-brainprint = "spectral_brainprint.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
